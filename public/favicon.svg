  <circle cx="16" cy="16" r="12.4" fill="none" stroke="#f5ede1" stroke-width="3.8"></circle>
  <line x1="6" y1="19.5" x2="26" y2="19.5" stroke="#f5ede1" stroke-width="3.8"></line>
</svg>
